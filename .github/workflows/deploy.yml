name: פרסום ל-GitHub Pages

on:
  push:
    branches: [main]
  # מאפשר פרסום ידני מכל ענף (Actions ← פרסום ל-GitHub Pages ← Run workflow)
  workflow_dispatch:

# הרשאות נדרשות לפרסום דרך GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# פרסום אחד בכל רגע; לא מבטלים פרסום שכבר רץ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: בנייה
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: התקנת תלויות
        run: npm ci

      - name: בדיקות יחידה
        run: npm test

      - name: בנייה
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: פרסום
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
