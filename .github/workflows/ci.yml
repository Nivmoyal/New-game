name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: בדיקות ובנייה
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: התקנת תלויות
        run: npm ci

      - name: בדיקת טיפוסים
        run: npm run typecheck

      - name: בדיקות יחידה
        run: npm test

      - name: בנייה
        run: npm run build

      - name: שמירת תוצרי הבנייה
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
